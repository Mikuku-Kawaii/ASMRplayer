name: Signed release
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Include a signed Android APK in the shared update manifest
        type: boolean
        default: false
      android_version_code:
        description: Increasing Android versionCode (or use ANDROID_VERSION_CODE repository variable)
        type: string
        required: false
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || vars.SIGNED_RELEASE_CI == 'true'
    runs-on: windows-latest
    env:
      BUILD_ANDROID: ${{ inputs.build_android || (github.event_name == 'push' && vars.ANDROID_SIGNED_RELEASE_CI == 'true') }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code || vars.ANDROID_VERSION_CODE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Configure the TAURI_SIGNING_PRIVATE_KEY Actions secret before running a signed build.'
          }
      - name: Check Android signing configuration
        if: env.BUILD_ANDROID == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Configure the $name Actions secret." }
          }
          $androidCode = 0
          if (-not [int]::TryParse($env:ANDROID_VERSION_CODE, [ref]$androidCode) -or $androidCode -lt 1 -or $androidCode -gt 2100000000) {
            throw 'Set an increasing ANDROID_VERSION_CODE or android_version_code input.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Verify native runtime
        shell: pwsh
        run: ./scripts/fetch-runtime.ps1
      - name: Build and sign
        shell: pwsh
        env:
          ASMR_ONEDRIVE_CLIENT_ID: ${{ vars.ASMR_ONEDRIVE_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/prepare-release.ps1
      - uses: actions/setup-java@v6
        if: env.BUILD_ANDROID == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: env.BUILD_ANDROID == 'true'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify Android backend
        if: env.BUILD_ANDROID == 'true'
        shell: pwsh
        run: |
          ./android/gradlew.bat -p android :audio-core:test :app:testDebugUnitTest :app:lintDebug --console=plain --no-daemon
          if ($LASTEXITCODE) { throw 'Android backend checks failed.' }
          node --test scripts/android-update-manifest.test.mjs
          if ($LASTEXITCODE) { throw 'Shared manifest checks failed.' }
      - name: Build Android and merge shared manifest
        if: env.BUILD_ANDROID == 'true'
        shell: pwsh
        env:
          ASMR_ONEDRIVE_CLIENT_ID: ${{ vars.ASMR_ONEDRIVE_CLIENT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $env:ANDROID_KEYSTORE_FILE = Join-Path $env:RUNNER_TEMP 'asmr-android-release.keystore'
          try {
            [IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE_FILE, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            ./scripts/prepare-android-release.ps1 -VersionCode ([int]$env:ANDROID_VERSION_CODE)
          } finally {
            if (Test-Path -LiteralPath $env:ANDROID_KEYSTORE_FILE) { Remove-Item -LiteralPath $env:ANDROID_KEYSTORE_FILE -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ANDROID == 'true' && 'signed-windows-android-release' || 'signed-windows-release' }}
          path: output/release/
          if-no-files-found: error
      - name: Create reviewable release draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(Get-ChildItem "output/release/v$version" -File | Where-Object { $_.Extension -in @('.exe', '.msi', '.apk') -or $_.Name -eq 'latest.json' } | ForEach-Object FullName)
          gh release create "v$version" @files --draft --verify-tag --title "ASMR Player $version" --notes-file "docs/releases/v$version.md"
          if ($LASTEXITCODE) { throw 'Failed to create release draft' }
